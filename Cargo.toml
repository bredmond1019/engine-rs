[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-contract",
    "crates/engine-store",
    "crates/engine-serve",
    "crates/term-core",
    "crates/term-attach",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
cron = "0.12"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
actix-web = "4"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
claude-code-rs = { package = "claude-sdk-rs", path = "../claude-code-rs" }
regex = "1"
mev = { path = "../mev" }
okf-core = { path = "../okf-core" }
tempfile = "3"
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Dev/test link-time speedup — engine-core alone compiles to 25+ integration-test binaries, each
# statically linking the whole crate + its dependency graph (tokio/serde/actix-web/sqlx). Both
# settings cut per-binary link cost without changing what gets compiled or tested, and without
# touching `cargo build --release` (a separate, intentionally slower profile).
[profile.dev]
# Keep panic/backtrace line numbers; drop full DWARF type descriptions (biggest link-time cost
# for a type-heavy, generic-dependency-laden crate like this one).
debug = "line-tables-only"
# Skip macOS's dsymutil debug-info-bundling pass (a classic slow post-link step, run once per
# binary); leave debug info split across .o files instead. Backtraces still resolve correctly.
split-debuginfo = "unpacked"
