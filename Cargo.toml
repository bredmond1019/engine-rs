[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-contract",
    "crates/engine-store",
    "crates/engine-serve",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
