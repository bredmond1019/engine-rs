[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-contract",
    "crates/engine-store",
    "crates/engine-serve",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
actix-web = "4"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
claude-code-rs = { path = "../claude-code-rs" }
regex = "1"
mev = { path = "../mev" }
okf-core = { path = "../okf-core" }
