[package]
name = "engine-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
claude-code-rs = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
engine-contract = { path = "../engine-contract" }
mev = { workspace = true }
okf-core = { workspace = true }
sha2 = { workspace = true }
term-core = { path = "../term-core", features = ["tokio"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
engine-serve = { path = "../engine-serve" }
tempfile = { workspace = true }
# Test-only: EN.11.I task 2's instrumentation tests capture emitted tracing
# events via `tracing_subscriber`'s `Layer`/`Registry` machinery, asserting
# span-field propagation (`run_id`/`campaign_id`) rather than parsing a real
# log file. `engine-core` itself never installs a subscriber in production
# code — see `engine_serve::init_tracing` — so this stays dev-only.
tracing-subscriber = { workspace = true }

# ONE integration-test binary, not one per file. cargo builds a separate binary for every
# `tests/*.rs`, and each statically links this crate plus its ~345-crate dependency graph — at 25
# files that was ~25 x 20MB of linking per full test run, measured (2026-07-29) as the largest
# single cost in this repo's SDLC loop. Every integration test now lives in `tests/it/<name>.rs`
# and is declared as a module in `tests/it/main.rs`. Per-test isolation is unchanged: `cargo
# nextest run` (CLAUDE.md standing rule 7) runs each test in its own process regardless.
[[test]]
name = "it"
path = "tests/it/main.rs"
