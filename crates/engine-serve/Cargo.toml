[package]
name = "engine-serve"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
engine-contract = { path = "../engine-contract" }
engine-store = { path = "../engine-store" }
# `EN.15.I` task 2: `register_held_session`'s factory builds a live
# `TmuxDriver` for `HeldSessionNode` — the same `term-core` dependency
# `engine-core` already carries, added directly here because
# `engine-core` does not re-export `term_core::driver`.
term-core = { path = "../term-core", features = ["tokio"] }
# `EN.15.C` task 6: the eight `/api/coordination/*` write-route request bodies embed
# `okf_core::LeaseKind`/`LeaseScope` directly (both already `Deserialize`) rather than
# reinventing a parallel wire enum in this crate — see `http.rs`'s `CoordLeaseBody`.
okf-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
actix-web = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Exposes `test_fixtures` (shared Node fixtures for unit + integration
# tests) outside of `cfg(test)`. Never enabled by a normal dependent —
# only by this crate's own [dev-dependencies] entry below, so every
# `tests/*.rs` integration binary gets it, but `bastion` (a normal
# dependent) never does.
test-fixtures = []

[dev-dependencies]
engine-serve = { path = ".", features = ["test-fixtures"] }
tempfile = { workspace = true }
claude-code-rs = { workspace = true }

# ONE integration-test binary, not one per file. cargo builds a separate binary for every
# `tests/*.rs`, and each statically links this crate plus its dependency graph. These modules were
# moved from `engine-core`'s own single-binary `tests/it/` layout (see that crate's
# `tests/it/main.rs` for the full rationale) because they depend on `engine-serve` itself. Per-test
# isolation is unchanged: `cargo nextest run` (CLAUDE.md standing rule 8) runs each test in its own
# process regardless. The 8 pre-existing loose files directly under `tests/` are a separate,
# out-of-scope concern — only this new binary is added here.
[[test]]
name = "it"
path = "tests/it/main.rs"
