[package]
name = "engine-serve"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
engine-contract = { path = "../engine-contract" }
engine-store = { path = "../engine-store" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
actix-web = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[features]
# Exposes `test_fixtures` (shared Node fixtures for unit + integration
# tests) outside of `cfg(test)`. Never enabled by a normal dependent —
# only by this crate's own [dev-dependencies] entry below, so every
# `tests/*.rs` integration binary gets it, but `bastion` (a normal
# dependent) never does.
test-fixtures = []

[dev-dependencies]
engine-serve = { path = ".", features = ["test-fixtures"] }
